<style>
    body {
      min-height: max(884px, 100dvh);
    }

    .animate-delay-200 { animation-delay: 200ms; }
    .animate-delay-300 { animation-delay: 300ms; }
    .animate-delay-400 { animation-delay: 400ms; }
    .animate-delay-500 { animation-delay: 500ms; }
    
    .glass-input {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.60);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), inset 0 0 0 1px rgba(28, 28, 30, 0.1);
        border-color: rgba(28, 28, 30, 0.2);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-white">
<!-- Header Area -->
<header class="flex items-center justify-between px-page-margin h-16 sticky top-0 z-50 bg-background/80 backdrop-blur-xl">
<button class="p-2 -ml-2 rounded-full text-primary hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Optional right side action if needed, otherwise keep space balanced -->
<div class="w-10"></div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-page-margin pb-[80px]">
<!-- Title -->
<section class="mt-8 mb-section-gap opacity-0 animate-fade-in-up">
<h1 class="text-display-lg-mobile font-display-lg-mobile md:text-display-lg md:font-display-lg text-primary tracking-tight">Create Account</h1>
<p class="text-body-md font-body-md text-secondary mt-2">Join 吃了么 to start cooking smarter.</p>
</section>
<!-- Form Area -->
<section class="flex-1 max-w-md mx-auto w-full space-y-element-gap-comfortable">
<form action="#" class="space-y-6" method="POST">
<!-- Inputs Container -->
<div class="space-y-element-gap-comfortable">
<!-- Username -->
<div class="opacity-0 animate-fade-in-up animate-delay-100">
<label class="sr-only" for="username">Username</label>
<div class="relative">
<input class="w-full glass-input text-primary placeholder:text-placeholder-grey rounded-xl py-4 px-4 focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all text-body-md font-body-md" id="username" name="username" placeholder="Username" required="" type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="opacity-0 animate-fade-in-up animate-delay-200">
<label class="sr-only" for="phone">Phone number</label>
<div class="relative flex glass-input rounded-xl overflow-hidden focus-within:ring-1 focus-within:ring-primary-container focus-within:border-primary-container transition-all">
<span class="inline-flex items-center px-4 border-r border-glass-stroke text-secondary text-body-md font-body-md bg-transparent">
                                +86
                            </span>
<input class="w-full bg-transparent text-primary placeholder:text-placeholder-grey py-4 px-4 focus:outline-none text-body-md font-body-md" id="phone" name="phone" placeholder="Phone number" required="" type="tel"/>
</div>
</div>
<!-- Verification Code -->
<div class="opacity-0 animate-fade-in-up animate-delay-300">
<label class="sr-only" for="code">Verification code</label>
<div class="relative flex gap-element-gap-tight">
<input class="flex-1 glass-input text-primary placeholder:text-placeholder-grey rounded-xl py-4 px-4 focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all text-body-md font-body-md" id="code" name="code" placeholder="Verification code" required="" type="text"/>
<button class="whitespace-nowrap px-6 py-4 rounded-xl glass-input text-primary text-label-md font-label-md hover:bg-surface-container-lowest transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20" type="button">
                                Get Code
                            </button>
</div>
</div>
<!-- Password -->
<div class="opacity-0 animate-fade-in-up animate-delay-400">
<label class="sr-only" for="password">Password</label>
<div class="relative">
<input class="w-full glass-input text-primary placeholder:text-placeholder-grey rounded-xl py-4 px-4 focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all text-body-md font-body-md" id="password" name="password" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 pt-2 opacity-0 animate-fade-in-up animate-delay-500">
<div class="flex items-center h-5">
<input class="h-5 w-5 rounded-md border-glass-stroke text-primary-container focus:ring-primary-container focus:ring-offset-background bg-surface-container-lowest transition-all cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="text-sm leading-5">
<label class="text-label-md font-label-md text-secondary cursor-pointer" for="terms">
                            I agree to the <a class="text-primary hover:underline" href="#">User Terms</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>
</label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-section-gap opacity-0 animate-fade-in-up animate-delay-500">
<button class="w-full flex justify-center py-4 px-4 rounded-[14px] shadow-sm text-label-md font-label-md text-white bg-[#1C1C1E] hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container focus:ring-offset-background transition-all shadow-[0px_8px_24px_rgba(28,28,30,0.15)] hover:shadow-[0px_12px_32px_rgba(28,28,30,0.25)] active:scale-[0.98]" type="submit">
                        Sign Up
                    </button>
</div>
</form>
<div class="text-center mt-8 opacity-0 animate-fade-in-up animate-delay-500">
<p class="text-label-md font-label-md text-secondary">
                    Already have an account? <a class="text-primary font-semibold hover:underline" href="#">Log in</a>
</p>
</div>
</section>
</main>
</body></html>
