<!-- JavaScript for simple interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputField = document.querySelector('input[type="text"]');
            const sendBtn = document.querySelector('.bg-\\[\\#FF6B35\\]');
            
            // Simple visual feedback for input focus
            inputField.addEventListener('focus', () => {
                inputField.parentElement.classList.add('shadow-lg');
            });
            inputField.addEventListener('blur', () => {
                inputField.parentElement.classList.remove('shadow-lg');
            });

            // Simulate sending a message (visual only)
            sendBtn.addEventListener('click', () => {
                if(inputField.value.trim() !== '') {
                    inputField.value = '';
                    // In a real app, this would trigger adding a new message bubble
                }
            });
            
            inputField.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    sendBtn.click();
                }
            });
        });
    </script>
