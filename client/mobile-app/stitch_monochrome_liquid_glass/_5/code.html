</div>
</div>

</div>
</div>

<script>
        // Minimal interaction logic for input focus states
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary');
                this.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-placeholder-grey');
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary');
                this.parentElement.querySelector('.material-symbols-outlined').classList.add('text-placeholder-grey');
            });
        });
    </script>
