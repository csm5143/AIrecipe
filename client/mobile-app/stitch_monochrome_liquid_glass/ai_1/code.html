<div class="fixed inset-0 bg-black opacity-0 pointer-events-none z-[100] transition-opacity duration-700 ease-in-out" id="transition-overlay"></div><script>
  document.querySelector('main button').addEventListener('click', function() {
    const overlay = document.getElementById('transition-overlay');
    const header = document.querySelector('header');
    const main = document.querySelector('main');
    const nav = document.querySelector('nav');

    overlay.classList.remove('opacity-0');
    overlay.classList.add('opacity-100');

    [header, main, nav].forEach(el => {
      if(el) {
        el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
        el.style.opacity = '0';
        el.style.transform = 'scale(0.98)';
      }
    });

    setTimeout(() => {
      // This is where navigation to the next screen would happen
      console.log('Transition complete');
    }, 700);
  });

  const publishBtn = document.getElementById('nav-publish-btn');
  const publishIcon = document.getElementById('nav-publish-icon');
  const bottomSheet = document.getElementById('publish-bottom-sheet');
  const bottomSheetPanel = document.getElementById('publish-panel');
  const bottomSheetBackdrop = document.getElementById('publish-backdrop');
  let isSheetOpen = false;

  function toggleSheet() {
      isSheetOpen = !isSheetOpen;
      if (isSheetOpen) {
          bottomSheet.classList.remove('pointer-events-none', 'opacity-0');
          bottomSheetPanel.classList.remove('translate-y-full');
          publishIcon.style.transform = 'rotate(45deg)';
          publishBtn.classList.add('bg-primary', 'text-on-primary');
          publishBtn.classList.remove('bg-surface-variant', 'text-on-surface');
      } else {
          bottomSheet.classList.add('pointer-events-none', 'opacity-0');
          bottomSheetPanel.classList.add('translate-y-full');
          publishIcon.style.transform = 'rotate(0deg)';
          publishBtn.classList.remove('bg-primary', 'text-on-primary');
          publishBtn.classList.add('bg-surface-variant', 'text-on-surface');
      }
  }

  publishBtn.addEventListener('click', toggleSheet);
  bottomSheetBackdrop.addEventListener('click', toggleSheet);
</script></body></html>
