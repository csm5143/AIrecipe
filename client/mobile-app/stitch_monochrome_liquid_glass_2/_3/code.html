<body class="bg-background text-on-background font-body-lg min-h-screen antialiased selection:bg-surface-dim">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-page-margin py-element-gap-comfortable bg-glass-surface backdrop-blur-xl border-b border-glass-stroke">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined font-headline-md text-headline-md" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">上传菜谱</h1>
<button class="bg-primary-container text-on-primary px-4 py-1.5 rounded-[14px] font-label-md text-label-md hover:opacity-90 transition-opacity active:scale-95 duration-150 shadow-md">

        </button>
</header>

<!-- Hero Image Upload -->
<section class="relative w-full aspect-[4/3] rounded-[22px] bg-surface-container-low flex flex-col items-center justify-center border border-dashed border-outline-variant cursor-pointer hover:bg-surface-container transition-colors group overflow-hidden">
<div class="z-10 flex flex-col items-center gap-2 text-secondary group-hover:scale-105 transition-transform duration-300">
<span class="material-symbols-outlined text-[48px] opacity-80" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
<span class="font-label-md text-label-md">添加封面图</span>
</div>
<!-- Optional hover overlay for liquid feel -->
<div class="absolute inset-0 bg-gradient-to-t from-black/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
</section>
<!-- Form Fields -->
<section class="space-y-4">
<div>
<input class="w-full rounded-[16px] px-card-padding py-4 font-headline-md text-headline-md text-primary placeholder-placeholder-grey liquid-glass-input" placeholder="Recipe Name" type="text"/>
</div>
<div>
<textarea class="w-full rounded-[16px] px-card-padding py-4 font-body-md text-body-md text-secondary placeholder-placeholder-grey liquid-glass-input resize-none" placeholder="Description" rows="3"></textarea>
</div>
</section>
<!-- Core Info Section -->
<section class="flex gap-element-gap-comfortable overflow-x-auto pb-2 snap-x">

<div class="flex-shrink-0 flex items-center gap-2 liquid-glass-input rounded-full px-4 py-2 snap-start">

<input class="bg-transparent border-none p-0 focus:ring-0 font-label-md text-label-md text-primary placeholder-placeholder-grey w-24" placeholder="Cooking Time" type="text"/>
</div>

<div class="flex-shrink-0 flex items-center gap-2 liquid-glass-input rounded-full px-4 py-2 snap-start cursor-pointer hover:bg-surface-container-highest/20 transition-colors">
<span class="material-symbols-outlined text-secondary text-[18px]" style="font-variation-settings: 'FILL' 0;">bar_chart</span>
<select class="bg-transparent border-none p-0 pr-6 focus:ring-0 font-label-md text-label-md text-primary cursor-pointer appearance-none">

<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>
<span class="material-symbols-outlined text-secondary text-[16px] -ml-4 pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>

<input class="bg-transparent border-none p-0 focus:ring-0 font-label-md text-label-md text-primary placeholder-placeholder-grey w-20" placeholder="Servings" type="text"/>

</section>

<input class="w-1/3 rounded-[16px] px-4 py-3 font-body-md text-body-md text-primary placeholder-placeholder-grey liquid-glass-input text-right" placeholder="Amount" type="text"/>
<button class="text-secondary hover:text-error transition-colors p-2">

<!-- Ingredient Row 2 -->

<input class="flex-1 rounded-[16px] px-4 py-3 font-body-md text-body-md text-primary placeholder-placeholder-grey liquid-glass-input" placeholder="Ingredient Name" type="text"/>
<input class="w-1/3 rounded-[16px] px-4 py-3 font-body-md text-body-md text-primary placeholder-placeholder-grey liquid-glass-input text-right" placeholder="Amount" type="text"/>
<button class="text-secondary hover:text-error transition-colors p-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">close</span>

</div>
</div>

<div class="relative pl-10">

<div class="space-y-3">
<textarea class="w-full rounded-[16px] px-4 py-3 font-body-md text-body-md text-primary placeholder-placeholder-grey liquid-glass-input resize-none" placeholder="Describe this step..." rows="2"></textarea>
<div class="w-24 h-24 rounded-[12px] bg-surface-container-low flex items-center justify-center border border-dashed border-outline-variant cursor-pointer hover:bg-surface-container transition-colors text-secondary">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
</div>
</div>
</div>
</div>
<button class="w-full liquid-glass flex items-center justify-center gap-2 py-4 rounded-[16px] text-primary hover:bg-surface-container-highest/20 transition-colors font-label-md text-label-md font-bold mt-4 shadow-sm active:scale-[0.98]">

<script>
        // Simple interactive script to add subtle hover effects on inputs if needed beyond CSS
        document.querySelectorAll('.liquid-glass-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('focused-state');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('focused-state');
            });
        });
    </script>
