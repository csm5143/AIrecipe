<style>

            -webkit-tap-highlight-color: transparent;

            background: theme('colors.glass-surface');
            backdrop-filter: blur(24px);

<body class="font-body-md text-on-surface antialiased h-screen flex flex-col overflow-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-page-margin py-element-gap-comfortable liquid-glass border-b border-glass-stroke">
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-highest/50 transition-colors">
<span class="material-symbols-outlined text-primary text-[24px]">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">发帖子</h1>
<button class="bg-primary text-on-primary px-4 py-2 rounded-xl font-label-md text-label-md hover:opacity-80 transition-opacity active:scale-95">
            Publish
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto mt-[72px] mb-[80px] px-page-margin pt-section-gap pb-section-gap hide-scrollbar">
<!-- Text Input -->
<div class="mb-section-gap">
<textarea class="w-full h-32 bg-transparent border-none resize-none font-body-lg text-body-lg text-on-surface placeholder:text-placeholder-grey p-0 focus:ring-0" placeholder="分享你的美食心得..."></textarea>
</div>
<!-- Image Upload Grid -->
<div class="grid grid-cols-3 gap-element-gap-comfortable mb-section-gap">
<!-- Add Photo Button -->
<button class="aspect-square rounded-2xl liquid-glass flex flex-col items-center justify-center border border-surface-variant hover:bg-surface-container/50 transition-colors group">
<span class="material-symbols-outlined text-secondary text-[32px] group-hover:text-primary transition-colors mb-1" data-weight="fill">add_photo_alternate</span>
<span class="font-label-sm text-label-sm text-secondary group-hover:text-primary transition-colors">Add Photo</span>
</button>
</div>
<hr class="border-subtle-divider mb-section-gap"/>
<!-- Tags and Metadata -->
<div class="space-y-element-gap-comfortable">
<!-- Location Tag -->
<button class="flex items-center space-x-2 px-4 py-2 rounded-full liquid-glass border border-surface-variant hover:bg-surface-container/50 transition-colors w-fit">
<span class="material-symbols-outlined text-secondary text-[18px]">location_on</span>
<span class="font-label-md text-label-md text-secondary">Add Location</span>
</button>
<!-- Topics -->
<div class="flex flex-wrap gap-element-gap-tight">
<button class="px-4 py-2 rounded-full liquid-glass border border-surface-variant text-primary font-label-md text-label-md hover:bg-surface-container/50 transition-colors">
                    # DailyFood
                </button>
<button class="px-4 py-2 rounded-full liquid-glass border border-surface-variant text-primary font-label-md text-label-md hover:bg-surface-container/50 transition-colors">
                    # CookingTips
                </button>
<button class="px-4 py-2 rounded-full border border-dashed border-outline-variant text-secondary font-label-md text-label-md hover:bg-surface-container-lowest transition-colors flex items-center">
<span class="material-symbols-outlined text-[16px] mr-1">add</span> Topic
                </button>
</div>
</div>
</main>
<!-- Bottom Toolbar (Above Keyboard) -->
<footer class="fixed bottom-0 left-0 w-full z-40 liquid-glass border-t border-glass-stroke px-page-margin py-3 pb-8 md:pb-3 flex items-center justify-between">
<div class="flex items-center space-x-6 text-secondary">
<button aria-label="Format Bold" class="hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">format_bold</span>
</button>
<button aria-label="Format List" class="hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">format_list_bulleted</span>
</button>
<button aria-label="Mention" class="hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">alternate_email</span>
</button>
<button aria-label="Emoji" class="hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">sentiment_satisfied</span>
</button>
</div>
<div class="text-label-sm font-label-sm text-secondary">
            0 / 500
        </div>
</footer>
<script>
        // Auto-resize textarea
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            // Limit to max height to avoid covering too much screen
            if (this.scrollHeight > 250) {
                this.style.height = '250px';
                this.style.overflowY = 'auto';
            } else {
                this.style.overflowY = 'hidden';
            }
        });
    </script>
