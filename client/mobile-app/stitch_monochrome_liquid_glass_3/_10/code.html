<body class="bg-background text-on-background antialiased min-h-screen font-sans">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-3xl border-b border-glass-stroke shadow-[0px_4px_24px_rgba(0,0,0,0.04)] bg-glass-surface dark:bg-primary-container">
<div class="flex items-center justify-between px-page-margin h-16 w-full max-w-screen-xl mx-auto">
<button class="text-primary dark:text-on-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-on-primary font-bold">吃了么</h1>
<button class="text-primary dark:text-on-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="pt-24 pb-32 px-page-margin max-w-md mx-auto">
<!-- Header -->
<div class="mb-section-gap text-center">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-2">Storage</h2>
<p class="font-body-md text-body-md text-secondary">Manage your app data and cache.</p>
</div>
<!-- Storage Chart Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_4px_24px_rgba(0,0,0,0.04)] mb-section-gap flex flex-col items-center">
<!-- Circular Progress Chart -->
<div class="relative w-48 h-48 mb-6">
<svg class="w-full h-full" viewbox="0 0 120 120">
<!-- Background Circle -->
<circle cx="60" cy="60" fill="none" r="50" stroke="#f3f3f5" stroke-width="12"></circle>
<!-- Other (App Base) -->
<circle class="progress-ring__circle" cx="60" cy="60" fill="none" r="50" stroke="#e0dfe4" stroke-dasharray="314" stroke-dashoffset="0" stroke-width="12"></circle>
<!-- AI Cache -->
<circle class="progress-ring__circle" cx="60" cy="60" fill="none" r="50" stroke="#5e5e63" stroke-dasharray="314" stroke-dashoffset="120" stroke-width="12"></circle>
<!-- Images -->
<circle class="progress-ring__circle" cx="60" cy="60" fill="none" r="50" stroke="#010102" stroke-dasharray="314" stroke-dashoffset="240" stroke-width="12"></circle>
</svg>
<!-- Center Text -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-headline-lg text-headline-lg text-primary">2.4</span>
<span class="font-label-md text-label-md text-secondary">GB Used</span>
</div>
</div>
<!-- Legend -->
<div class="w-full space-y-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-primary"></div>
<span class="font-body-md text-body-md text-on-surface">Images &amp; Media</span>
</div>
<span class="font-label-md text-label-md text-secondary">1.2 GB</span>
</div>
<div class="w-full h-px bg-subtle-divider"></div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-secondary"></div>
<span class="font-body-md text-body-md text-on-surface">AI Cache</span>
</div>
<span class="font-label-md text-label-md text-secondary">850 MB</span>
</div>
<div class="w-full h-px bg-subtle-divider"></div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-secondary-container"></div>
<span class="font-body-md text-body-md text-on-surface">App Data</span>
</div>
<span class="font-label-md text-label-md text-secondary">350 MB</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="space-y-4">
<button class="w-full liquid-glass-btn flex items-center justify-between p-4 active:scale-95 transition-transform duration-200">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="image">image</span>
</div>
<div class="text-left">
<p class="font-body-md text-body-md font-semibold text-primary">Clear Image Cache</p>
<p class="font-label-sm text-label-sm text-secondary">Frees up ~1.2 GB</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full liquid-glass-btn flex items-center justify-between p-4 active:scale-95 transition-transform duration-200">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="memory">memory</span>
</div>
<div class="text-left">
<p class="font-body-md text-body-md font-semibold text-primary">Clear AI History</p>
<p class="font-label-sm text-label-sm text-secondary">Frees up ~850 MB</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary" data-icon="chevron_right">chevron_right</span>
</button>
</div>
