<script>
        // Simple scroll effect for TopAppBar to increase blur/shadow on scroll
        window.addEventListener('scroll', () => {
            const header = document.getElementById('top-app-bar');
            if (window.scrollY > 10) {
                header.classList.add('shadow-sm');
                header.classList.replace('bg-glass-surface/72', 'bg-glass-surface/90');
            } else {
                header.classList.remove('shadow-sm');
                header.classList.replace('bg-glass-surface/90', 'bg-glass-surface/72');
            }
        });
