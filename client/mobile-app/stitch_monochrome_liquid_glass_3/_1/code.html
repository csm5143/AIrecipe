<style>
        .liquid-glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.60), 0px 4px 24px rgba(0,0,0,0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background antialiased min-h-screen font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-glass-surface backdrop-blur-3xl border-b border-glass-stroke shadow-[0px_4px_24px_rgba(0,0,0,0.04)]">
<div class="flex items-center justify-between px-page-margin h-16 w-full max-w-screen-xl mx-auto">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary font-bold">Edit Profile</h1>
<button class="font-label-md text-label-md text-primary font-bold hover:opacity-80 transition-opacity active:scale-95 duration-200">
                Save
            </button>
</div>
</header>
<main class="pt-24 pb-32 px-page-margin max-w-screen-md mx-auto">
<!-- Profile Photo Upload -->
<section class="flex flex-col items-center justify-center mb-section-gap">
<div class="relative w-32 h-32 rounded-full mb-element-gap-comfortable group cursor-pointer">
<div class="absolute inset-0 rounded-full overflow-hidden shadow-lg border border-glass-stroke">
<img alt="Current Profile Photo" class="w-full h-full object-cover" data-alt="A close-up portrait of a professional individual in a minimalist, light-mode setting. The lighting is soft and diffused, highlighting natural skin tones against a pristine white background. The overall aesthetic is clean, high-end, and sophisticated, reflecting a modern and polished personal brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAk1KxBP5w43LD3ANb5j9HVm1-A_ogbpX0dNA9R2XT6_vqgTH9yJIcXyl0WLTmFeszPtJgDnwJmN1j1x35oilUH4HwyKvRN06QWQzmaZ2Qza0TFzxRFDzQyHqZ-X91SawKwIIXkewhGH3QeQReETgZiZMpm59ViOIWjsVfABGsU9BUr7sGYHqV7QftevdhXE70XJaHAtSVMCgRgsNmRiHwdp3PSZ_wQ6ZGLifJir48Xk6TpkrIL0Vk6HW0PCaF4iKkeYs03-AXpKYs"/>
</div>
<div class="absolute inset-0 rounded-full bg-primary/20 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<div class="w-10 h-10 rounded-full bg-white/80 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary" data-icon="edit">edit</span>
</div>
</div>
<!-- Edit Icon Overlay (Persistent) -->
<div class="absolute bottom-0 right-0 w-10 h-10 rounded-full liquid-glass flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="photo_camera" data-weight="fill" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<span class="font-label-md text-label-md text-secondary">Tap to change photo</span>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-element-gap-comfortable">
<!-- Nickname Input -->
<div class="flex flex-col gap-element-gap-tight">
<label class="font-label-sm text-label-sm text-secondary ml-1" for="nickname">Nickname</label>
<div class="liquid-glass rounded-lg overflow-hidden flex items-center px-4 py-3 focus-within:ring-2 focus-within:ring-primary focus-within:border-transparent transition-all">
<input class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-primary placeholder:text-placeholder-grey focus:ring-0" id="nickname" placeholder="Enter your nickname" type="text" value="Alex Design"/>
</div>
</div>
<!-- Bio Input -->
<div class="flex flex-col gap-element-gap-tight">
<label class="font-label-sm text-label-sm text-secondary ml-1" for="bio">Bio</label>
<div class="liquid-glass rounded-lg overflow-hidden flex items-start px-4 py-3 focus-within:ring-2 focus-within:ring-primary focus-within:border-transparent transition-all">
<textarea class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-primary placeholder:text-placeholder-grey focus:ring-0 resize-none" id="bio" placeholder="Tell us a bit about yourself" rows="3">Food enthusiast. Lover of minimalist design and clean typography.</textarea>
</div>
</div>
<!-- Gender Selection -->
<div class="flex flex-col gap-element-gap-tight">
<label class="font-label-sm text-label-sm text-secondary ml-1">Gender</label>
<div class="grid grid-cols-3 gap-element-gap-tight">
<button class="liquid-glass rounded-lg py-3 flex items-center justify-center hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-body-md text-primary">Female</span>
</button>
<button class="bg-primary text-on-primary rounded-lg py-3 flex items-center justify-center shadow-md transition-transform active:scale-95">
<span class="font-body-md text-body-md font-medium">Male</span>
</button>
<button class="liquid-glass rounded-lg py-3 flex items-center justify-center hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-body-md text-primary">Other</span>
</button>
</div>
</div>
</section>
</main>
</body></html>
