<style>
        /* Custom utilities for liquid glass refraction effect */
        .glass-edge {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background antialiased min-h-screen selection:bg-surface-variant">
<!-- TopAppBar (Shared Component verbatim) -->
<header class="fixed top-0 w-full z-50 bg-glass-surface dark:bg-primary-container backdrop-blur-3xl border-b border-glass-stroke shadow-[0px_4px_24px_rgba(0,0,0,0.04)]">
<div class="flex items-center justify-between px-page-margin h-16 w-full max-w-screen-xl mx-auto">
<!-- Leading Icon -->
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-variant active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-primary dark:text-on-primary">arrow_back</span>
</button>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-on-primary absolute left-1/2 -translate-x-1/2">
                吃了么
            </h1>
<!-- Trailing Icon -->
<button class="flex items-center justify-center w-10 h-10 -mr-2 rounded-full hover:bg-surface-variant active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-primary dark:text-on-primary">search</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<!-- Safe padding top to clear the fixed header -->
<main class="pt-24 pb-32 max-w-screen-sm mx-auto">
<!-- Page Header -->
<div class="px-page-margin mb-8">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Privacy Settings</h2>
<p class="font-body-md text-body-md text-secondary mt-2">Manage your visibility and data permissions.</p>
</div>
<!-- Visibility Section -->
<section class="mb-section-gap px-page-margin">
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-wider mb-3 ml-2">Visibility</h3>
<!-- Liquid Glass List Group -->
<div class="bg-glass-surface backdrop-blur-3xl border border-glass-stroke rounded-xl shadow-[0px_4px_24px_rgba(0,0,0,0.04)] glass-edge overflow-hidden flex flex-col">
<!-- Tile: Who can see my collections -->
<button class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-surface-variant/50 active:bg-surface-variant transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[20px] text-primary">collections_bookmark</span>
</div>
<span class="font-body-lg text-body-lg text-primary">Who can see my collections</span>
</div>
<div class="flex items-center gap-1">
<span class="font-body-md text-body-md text-secondary">Public</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</div>
</button>
<!-- Subtle Divider -->
<div class="h-px bg-subtle-divider mx-4"></div>
<!-- Tile: Fridge visibility (Toggle) -->
<div class="w-full flex items-center justify-between p-4 bg-transparent">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[20px] text-primary">kitchen</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-primary">Fridge visibility</span>
<span class="font-body-md text-body-md text-secondary text-xs mt-0.5">Let followers see ingredients</span>
</div>
</div>
<!-- Toggle Switch (Active State) -->
<button class="relative inline-flex h-6 w-11 items-center rounded-full bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-outline focus:ring-offset-2">
<span class="inline-block h-5 w-5 translate-x-5 transform rounded-full bg-on-primary transition-transform shadow-sm"></span>
</button>
</div>
</div>
</section>
<!-- Access & Data Section -->
<section class="mb-section-gap px-page-margin">
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-wider mb-3 ml-2">Access &amp; Data</h3>
<!-- Liquid Glass List Group -->
<div class="bg-glass-surface backdrop-blur-3xl border border-glass-stroke rounded-xl shadow-[0px_4px_24px_rgba(0,0,0,0.04)] glass-edge overflow-hidden flex flex-col">
<!-- Tile: Block list -->
<button class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-surface-variant/50 active:bg-surface-variant transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[20px] text-primary">block</span>
</div>
<span class="font-body-lg text-body-lg text-primary">Block list</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Subtle Divider -->
<div class="h-px bg-subtle-divider mx-4"></div>
<!-- Tile: Data permissions -->
<button class="w-full flex items-center justify-between p-4 bg-transparent hover:bg-surface-variant/50 active:bg-surface-variant transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[20px] text-primary">database</span>
</div>
<span class="font-body-lg text-body-lg text-primary">Data permissions</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar is deliberately suppressed as this is a task-focused sub-page -->
</body></html>
