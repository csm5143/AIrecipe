# ===========================================
# AIRecipe 全栈应用 - 生产环境部署
# ===========================================
# 使用方式: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ==================== 数据库 ====================
  db:
    image: postgres:15-alpine
    container_name: airecipe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airecipe
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/admin-api/prisma:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - airecipe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airecipe"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: airecipe-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - airecipe-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端 API ====================
  admin-api:
    build:
      context: ./server/admin-api
      dockerfile: Dockerfile.prod
    container_name: airecipe-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-your_secure_password}@db:5432/airecipe?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      # 腾讯云 COS
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-guangzhou}
      TENCENT_COS_BASE_URL: ${TENCENT_COS_BASE_URL:-}
      # 微信小程序
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # AI 服务
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      DOUBAO_API_URL: ${DOUBAO_API_URL:-https://ark.cn-beijing.volces.com/api/v3}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airecipe-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 后台管理系统 ====================
  admin-web:
    build:
      context: ./client/admin-web
      dockerfile: Dockerfile.prod
    container_name: airecipe-admin-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      VITE_API_PREFIX: /api/v1
    volumes:
      - ./client/admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - admin-api
    networks:
      - airecipe-network

  # ==================== Web 网页端 ====================
  web:
    build:
      context: ./client/web
      dockerfile: Dockerfile
    container_name: airecipe-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      VITE_API_PREFIX: /api/v1
    volumes:
      - ./client/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - admin-api
    networks:
      - airecipe-network

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: airecipe-nginx
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - admin-api
      - admin-web
      - web
    networks:
      - airecipe-network

# ==================== 数据卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

# ==================== 网络 ====================
networks:
  airecipe-network:
    driver: bridge
